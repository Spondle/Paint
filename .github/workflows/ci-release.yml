name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  meson-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y gcc meson ninja-build gtk4-devel libadwaita-devel \
            pango-devel appstream desktop-file-utils

      - name: Configure, build, and test
        run: |
          meson setup build
          meson compile -C build
          meson test -C build -v
          desktop-file-validate data/io.github.spondle.Paint.desktop
          appstreamcli validate --no-net data/io.github.spondle.Paint.metainfo.xml

  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.spondle.Paint.flatpak
          manifest-path: packaging/flatpak/io.github.spondle.Paint.yml

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: io.github.spondle.Paint.flatpak

  rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM build dependencies
        run: |
          dnf install -y rpm-build tar gcc meson ninja-build gtk4-devel \
            libadwaita-devel cairo-devel pango-devel appstream \
            desktop-file-utils

      - name: Build RPM packages
        run: |
          VERSION=$(rpmspec -q --qf '%{version}\n' --srpm packaging/rpm/paint.spec | head -n1)
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS dist-rpm
          tar --exclude=.git --exclude=build --exclude=dist-rpm --exclude=dist-deb \
            --transform="s,^\.,Draw-${VERSION}," \
            -czf ~/rpmbuild/SOURCES/Draw-${VERSION}.tar.gz .
          cp packaging/rpm/paint.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/paint.spec
          find ~/rpmbuild/RPMS -type f -name '*.rpm' ! -name '*-debug*.rpm' \
            -exec cp {} dist-rpm/ \;

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: dist-rpm/*.rpm

  deb:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper \
            dpkg-dev meson ninja-build pkgconf libgtk-4-dev libadwaita-1-dev \
            libcairo2-dev libpango1.0-dev appstream desktop-file-utils

      - name: Build Debian packages
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist-deb
          find .. -maxdepth 1 -type f -name '*.deb' ! -name '*-dbgsym_*.deb' \
            -exec cp {} dist-deb/ \;

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist-deb/*.deb

  release:
    needs: [meson-test, flatpak, rpm, deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
